# Builds light with its JavaScript engine on Windows and runs its tests there, those of the engine and the DOM first:
# the V8 the binding ships for Windows is built for the MSVC ABI, so light is compiled with LLVM's MSVC-target clang
# and LLD rather than mingw-w64, which no other system checks. The release builds the same way (release.yml).
name: windows

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CLANG_VERSION: '21'
  GOWORK: 'off'
  CGO_ENABLED: '1'
  CGO_CXXFLAGS: -nostdinc++

jobs:
  v8:
    name: Windows (amd64, v8)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Clang for V8 (MSVC target, LLD)
        run: sh tools/release/llvm-windows.sh

      - name: Build
        run: go build -tags v8 -o dist/light.exe ./cmd/light && ls -l dist/light.exe

      - name: Vet
        run: go vet -tags v8 ./pkg/script/... ./internal/dom/...

      - name: Test the engine and the DOM
        run: go test -tags v8 ./pkg/script/... ./internal/dom/...

      # The tests skipped fail on Windows for reasons that are not V8's and are left to a change of their own: Unix
      # paths written in the test (globals, model, shell), Windows' coarse clock (a local request timed 0 ms, two
      # console lines of the same instant: loading, har, devtools), and the new-window keys (windows_test.go). Others
      # wait on time and now and then run out of it on the runner (TestAnAnswerEndsWithItsPage), so this step's failure
      # is shown but does not fail the job: the engine and the DOM above are what it holds to.
      - name: Test the rest
        continue-on-error: true
        run: |
          skip='TestADevelopersHelperAndFilesAreTakenButNotByARelease|TestTheOptionsOnlyOverrideWhatTheSettingsSay'
          skip+='|TestADevelopersFilesAreNamedByOneVariable|TestEachSystemHasItsCommandToOpenAFileAndToShowIt'
          skip+='|TestEachRequestOfAPageIsToldWithItsConnectionAndItsSteps|TestTheArchiveOfRealRequests'
          skip+='|TestTheConsoleListsRequestsWhenAskedTo|TestTheNewWindowKeysOpenOneOnTheStartPage'
          go test -tags v8 -skip "^($skip)\$" $(go list ./... | grep -v -e /pkg/script -e /internal/dom)
