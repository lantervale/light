version: '3'

includes:
    claude: .tk/claude/Taskfile.yaml #!tk
    default: .tk/default/Taskfile.yaml #!tk
    git: .tk/git/Taskfile.yaml #!tk
    golangci: .tk/golangci/Taskfile.yaml #!tk
    install: .tk/install/Taskfile.yaml #!tk
    license: .tk/license/Taskfile.yaml #!tk
    trufflehog: .tk/trufflehog/Taskfile.yaml #!tk

dotenv:
  - .env
  - PROJECT
  - .env.default

# The v8 tag builds light with its JavaScript engine (V8, through cgo: macOS and Linux, amd64 and arm64, and Windows
# amd64 with LLVM's clang, see docs/development.md). V8's headers need its own libc++, hence CGO_CXXFLAGS. Without
# the tag light builds everywhere and runs no script.
env:
  CGO_CXXFLAGS: -nostdinc++

vars:
  # web-platform-tests are cloned into .wpt/wpt (ignored by git) at the commit wpt.lock pins, with only the folders
  # tools/wpt/sparse.txt names; WPT_OUT is where a run's report goes.
  WPT: .wpt/wpt
  WPT_PIN:
    sh: cat wpt.lock
  WPT_SETUP:
    sh: echo "$(cat wpt.lock) $(cat tools/wpt/sparse.txt tools/wpt/pyproject.toml | shasum | cut -c1-12)"
  WPT_OUT: '{{.WPT_OUT | default ".wpt/results"}}'

tasks:
  run:
    desc: Run light with its JavaScript engine (needs ember's WebGPU library, once - cd ../ember && task wgpu)
    cmds:
      - go run -tags v8 ./cmd/light {{.CLI_ARGS}}

  run:plain:
    desc: Run light without a JavaScript engine, as a plain go run builds it
    cmds:
      - go run ./cmd/light {{.CLI_ARGS}}

  test:
    desc: Vet and test light, without and with its JavaScript engine (no GPU, no network)
    cmds:
      - go vet ./...
      - go test ./...
      - go vet -tags v8 ./...
      - go test -tags v8 ./...

  lint:
    desc: Lint light, without and with its JavaScript engine
    cmds:
      - task: golangci:lint
      - task: golangci:lint
        vars: {CLI_ARGS: --build-tags v8}

  # light-model, the helper that runs a language model for light, is a Go module of its own (helper/model): what it
  # is built on stays out of light's go.mod, and the workspace does not list it, hence GOWORK=off.
  model:build:
    desc: Build light-model, the helper that runs a language model for light, into dist (ignored by git) or the folder BIN names by its whole path
    dir: helper/model
    env: {GOWORK: "off", CGO_ENABLED: "0"}
    cmds:
      - go build -trimpath -o '{{.BIN | default "../../dist"}}/light-model{{exeExt}}' .

  model:test:
    desc: Vet and test light-model (no GPU, no network, no model - set LIGHT_MODEL_TEST_DEV as LIGHT_MODEL_DEV to run a real one already on this machine)
    dir: helper/model
    env: {GOWORK: "off", CGO_ENABLED: "0"}
    cmds:
      - go vet ./...
      - go test ./...

  # The same app a release ships (tools/release/bundle.sh), without GoReleaser: built for this Mac, on the ember
  # beside light inside the workspace, whose wgpu-native library it takes when `task wgpu` fetched it there.
  app:
    desc: Build light.app into dist (macOS) - light with its JavaScript engine, its library and light-model inside, signed ad hoc; open dist/light.app starts it
    platforms: [darwin]
    vars:
      VERSION:
        sh: git describe --tags --always --dirty | sed 's/^v//'
      WGPU:
        sh: ls "$(go list -m -f '{{"{{.Dir}}"}}' github.com/lantervale/ember)/internal/wgpu/lib/darwin-{{ARCH}}/libwgpu_native.dylib" 2>/dev/null || true
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      CGO_CFLAGS: -O2 -g -mmacosx-version-min=13.0
      CGO_LDFLAGS: -O2 -g -mmacosx-version-min=13.0
    cmds:
      - go build -trimpath -tags v8 -ldflags "-s -w -X main.version={{.VERSION}}" -o dist/app/light ./cmd/light
      - LIGHT_OS=darwin LIGHT_ARCH={{ARCH}} LIGHT_BIN=dist/app/light LIGHT_VERSION={{.VERSION}} LIGHT_WGPU_LIB={{.WGPU}} sh tools/release/bundle.sh
      - rm -rf dist/light.app
      - ditto dist/stage/light_{{.VERSION}}_darwin_{{ARCH}}/light.app dist/light.app
      - codesign --verify --deep --strict dist/light.app
      - echo "dist/light.app ({{.VERSION}})"

  release:snapshot:
    desc: Build this system's release archive into dist, as the release workflow does, publishing nothing (needs GoReleaser v2 - brew install goreleaser; inside the workspace it builds on the ember beside light)
    preconditions:
      - sh: goreleaser --version | grep -Eq 'GitVersion:[[:space:]]+v?2\.'
        msg: "GoReleaser v2 is needed and the goreleaser first on PATH ({{.GORELEASER}}) is not: brew install goreleaser, and remove an older one that comes before it"
    vars:
      GORELEASER:
        sh: command -v goreleaser || echo none
    cmds:
      - goreleaser --version | grep -E 'GitVersion'
      - goreleaser build --snapshot --clean --single-target --id light-{{OS}}

  wpt:setup:
    desc: Fetch web-platform-tests at the commit wpt.lock pins into .wpt (ignored by git) - a shallow clone of the folders in tools/wpt/sparse.txt, its own Python virtualenv with its requirements, and light's product for its runner (tools/wpt)
    set: [errexit, pipefail]
    status:
      - test "$(cat .wpt/setup 2>/dev/null)" = "{{.WPT_SETUP}}"
    cmds:
      - rm -f .wpt/setup
      - test -d "{{.WPT}}/.git" || { git init -q "{{.WPT}}" && git -C "{{.WPT}}" remote add origin https://github.com/web-platform-tests/wpt; }
      - git -C "{{.WPT}}" sparse-checkout set --cone $(cat tools/wpt/sparse.txt)
      - git -C "{{.WPT}}" cat-file -e "{{.WPT_PIN}}^{commit}" 2>/dev/null || git -C "{{.WPT}}" fetch -q --depth 1 --filter=blob:none origin "{{.WPT_PIN}}"
      - git -C "{{.WPT}}" checkout -q --detach "{{.WPT_PIN}}"
      # wpt makes its virtualenv (.wpt/wpt/_venv3) and installs its requirements there the first time it is asked anything.
      - python3 "{{.WPT}}/wpt" run --help > /dev/null
      - '"{{.WPT}}/_venv3/bin/pip" --disable-pip-version-check install -q -e tools/wpt'
      - echo "{{.WPT_SETUP}}" > .wpt/setup

  wpt:
    desc: Run the web-platform-tests of tools/wpt/subset.txt (or those given - task wpt -- /dom/nodes/Node-contains.html) against light with its JavaScript engine, hidden, one at a time; the report goes to WPT_OUT (.wpt/results)
    deps: [wpt:setup]
    env:
      EMBER_HIDDEN: 1
    cmds:
      - go build -tags v8 -o .wpt/light ./cmd/light
      - mkdir -p "{{.WPT_OUT}}"
      - >-
        python3 "{{.WPT}}/wpt" run --no-manifest-download --no-install-fonts --processes 1 --no-pause-after-test
        --no-fail-on-unexpected --no-restart-on-unexpected --binary .wpt/light
        --log-wptreport "{{.WPT_OUT}}/wptreport.json" --log-raw "{{.WPT_OUT}}/raw.log" --log-grouped -
        light {{.CLI_ARGS | default "--include-file tools/wpt/subset.txt"}} < /dev/null
      - python3 tools/wpt/summary.py "{{.WPT_OUT}}/wptreport.json" | tee "{{.WPT_OUT}}/summary.txt"

  wpt:triage:
    desc: Group the failures of the last task wpt run by cause, ranked by the tests each would make pass alone (tools/wpttriage); triage.json and triage.md go beside its report
    cmds:
      - go run ./tools/wpttriage -report "{{.WPT_OUT}}/wptreport.json" -json "{{.WPT_OUT}}/triage.json" -md "{{.WPT_OUT}}/triage.md"
