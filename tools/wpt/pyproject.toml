[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wptrunner-light"
version = "0.1.0"
description = "light as a product of web-platform-tests' wptrunner"
requires-python = ">=3.10"

[project.entry-points."wptrunner.products"]
light = "wptrunner_light:get_product"

[tool.setuptools]
py-modules = ["wptrunner_light"]
